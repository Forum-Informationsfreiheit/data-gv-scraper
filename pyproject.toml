[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-client"
version = "0.1.0"
description = "API client generated from OpenAPI specification"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
]
